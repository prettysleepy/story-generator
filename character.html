<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Generator for Writers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  padding: 30px;
  text-align: center;
}
.container {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
}
button {
  padding: 14px 20px;
  border: none;
  border-radius: 10px;
  background: #4a6cf7;
  color: white;
  cursor: pointer;
}
.output {
  margin-top: 20px;
  font-size: 18px;
}
</style>
</head>
<body>

<div class="container">
  <h1>Character Generator</h1>
  <p>Create a detailed character with personality, flaws, backstory, and goals.</p>

  <button onclick="generate()">Generate Character</button>

  <div id="output" class="output"></div>

  <div style="margin-top:25px;text-align:center;">
    <a href="https://studentandwriter.com/" target="_blank" style="
      display:inline-block;
      padding:10px 16px;
      border-radius:10px;
      background:#eef2ff;
      color:#4a6cf7;
      text-decoration:none;
      font-weight:bold;">
      studentandwriter.com
    </a>
    <div style="font-size:13px;color:#666;margin-top:6px;">
      word lists and more
    </div>
  </div>

</div>

<script>
const traits = ["curious","brave","quiet","ambitious","kind"];
const flaws = ["avoids conflict","lies to protect others","fears failure"];
const goals = ["prove themselves","find the truth","protect someone"];
const backstories = ["grew up feeling invisible","lost something important","was always expected to be perfect"];

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function generate(){
  document.getElementById("output").innerText =
  "A " + pick(traits) + " character who " + pick(flaws) +
  ", wants to " + pick(goals) +
  ", and " + pick(backstories) + ".";
}
</script>

</body>
</html>
